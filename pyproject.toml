[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restoreguard-lab"
version = "1.1.0"
description = "Backup recovery security lab with SQLite reference and disposable native OpenBao experiments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7", "coverage>=7.4"]

[project.scripts]
restoreguard = "restoreguard.cli:main"

[tool.setuptools.packages.find]
include = ["restoreguard*"]

[tool.setuptools.package-data]
restoreguard = ["static/*"]

[tool.coverage.run]
source = ["restoreguard"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B905"]  # zip(strict=) is style
