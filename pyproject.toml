[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restoreguard-lab"
version = "1.0.0"
description = "Backup recovery security lab with SQLite reference and disposable native OpenBao experiments"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
restoreguard = "restoreguard.cli:main"

[tool.setuptools.packages.find]
include = ["restoreguard*"]

[tool.setuptools.package-data]
restoreguard = ["static/*"]
